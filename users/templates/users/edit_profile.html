{% extends 'base.html' %}
{% block title %}Edit profile · LeaveFlow{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width:650px"><div class="card-soft auth-card">
<h2 class="page-title mb-1">Edit profile</h2><p class="text-muted-custom mb-4">Keep your details up to date.</p>
<form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<div class="d-flex gap-2"><button class="btn btn-primary">Save changes</button><a class="btn btn-light" href="{% url 'accounts:profile' %}">Cancel</a></div>
</form></div></div>
{% endblock %}
